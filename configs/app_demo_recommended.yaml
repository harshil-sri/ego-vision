# Demo preset: the measured-best engine configuration.
# Evidence: reports/smoother_eval.md + reports/loop_eval.md +
# reports/val_error_analysis.md (2026-10-25, runs/baseline ep-1 ckpt).
#   - majority(k=5) smoother: best coverage/precision in the weak-model
#     regime (ema/hysteresis collapse at min_conf>=0.5)
#   - min_conf 0.4: coverage 0.97 vs 0.57 at 0.5, same fire precision
#   - optimistic policy: oracle advance 0.75 vs 0.34 strict
#   - recipe prior: model advance-rate 0.133 vs 0.077 without (leak 0.05)
# Run: python3 -m scripts.run_app --config configs/app_demo_recommended.yaml
#      (plus --mode/--run-dir/--clip as usual)
mode: keyboard
window_seconds: 2.0
T: 8
tick_hz: 5.0
matcher_hz: 2.0
smoother: majority
smoother_args: {k: 5}
min_conf: 0.4
recipe_prior: true
prior_leak: 0.05
policy: optimistic
embedder: dinov2
matcher_threshold: 0.5
ingredient_crop: show_zone
show_zone: [0.30, 0.25, 0.40, 0.50]
scan_seconds: 10.0
scan_fps: 3.0
idle_timeout_s: 45.0
metrics_every_s: 2.0
window_sample_every_s: 5.0
record_video: false
device: cpu

camera:
  source: /dev/video0
  width: 640
  height: 480
  fps: 30
  pixel_format: MJPG
