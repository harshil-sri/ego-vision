# temporal_attn variant comparison run: identical to
# configs/train_baseline.yaml except variant and out_dir. The attention
# module itself comes from the registry (reference/ or the owner's core/).
backbone: resnet34
variant: temporal_attn
num_verbs: 8
T: 8
img_size: 224
fast_seek: true
optimizer: adamw
lr: 3.0e-4
weight_decay: 0.01
lr_schedule: cosine
epochs: 12
batch_size: 16
amp: false
class_weights: true
seed: 42
grad_clip: null
out_dir: runs/temporal_attn
overfit_batch: null
device: cpu
data_root: /mnt/ssd/epic-kitchens
annotations_dir: /mnt/ssd/epic-tools/epic-kitchens-100-annotations
videos_root: /mnt/ssd/epic-kitchens/EPIC-256
heldout_participants: [P22, P30]
train_limit: null
